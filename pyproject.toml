[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alicat-flow-controller-ui"
version = "3.0.0"
description = "Desktop control and logging for addressed Alicat flow controllers"
requires-python = ">=3.11"
dependencies = [
    "alicat>=0.9,<0.10",
    "pyserial>=3.5,<4",
    "websockets>=15.0.1,<16",
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "scikit-learn>=1.6,<2",
    "threadpoolctl>=3.5,<4",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13,<1",
    "mcp>=2,<3",
    "pyte>=0.8,<1",
    "pywinpty>=3,<4; platform_system == 'Windows'",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]
pressure = ["npTDMS>=1.10,<2"]

[project.scripts]
flow-controller-v3 = "flow_controller.ui.qt_main_window:main"
mexa-584l-bridge = "mexa_bridge.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_controller*", "mexa_bridge*"]

[tool.setuptools.package-data]
"flow_controller.ui" = ["assets/*.svg"]
