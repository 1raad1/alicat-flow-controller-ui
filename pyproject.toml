[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alicat-flow-controller-ui"
version = "3.0.0"
description = "Desktop control and logging for addressed Alicat flow controllers"
requires-python = ">=3.11"
dependencies = [
    "alicat>=0.9,<0.10",
    "pyserial>=3.5,<4",
    "numpy>=2.0,<3",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13,<1",
]

# matplotlib is the legacy Tk app's plotting, openpyxl its .xlsx export; the Qt
# app needs neither.  Install them only to run ``--legacy`` or to export .xlsx.
[project.optional-dependencies]
legacy = ["matplotlib>=3.10,<4"]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
flow-controller-v3 = "flow_controller.ui.qt_main_window:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flow_controller*"]
